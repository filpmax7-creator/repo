name: Publish FloatSnap
on:
  push:
    paths: ['.github/workflows/publish-floatsnap.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Prepare verified package and Sileo page
        shell: python
        run: |
          import pathlib,urllib.request,zipfile,subprocess,json,gzip,bz2,hashlib,email.utils
          from PIL import Image
          def download(url,path):
              p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True)
              with urllib.request.urlopen(url) as r:p.write_bytes(r.read())
          download("https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-10dc-820a-92ac-3effdced687b/raw?se=2026-11-17T22%3A51%3A51Z&sp=r&sv=2026-06-06&sr=b&scid=28f2684d-3a80-4988-a243-f85dbcfb0db0&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-17T03%3A53%3A49Z&ske=2026-11-18T03%3A53%3A49Z&sks=b&skv=2026-06-06&sig=UO7qE7pWwSx4sYSg/spaIhwqBDyYTd662Y8kkdCnG/w%3D",'incoming')
          deb='debs/FloatSnap-0.9.9.12.deb'
          pathlib.Path('debs').mkdir(exist_ok=True)
          data=pathlib.Path('incoming').read_bytes()
          if data.startswith(b'!<arch>'):pathlib.Path(deb).write_bytes(data)
          else:
              with zipfile.ZipFile('incoming') as z:
                  names=[n for n in z.namelist() if n.endswith('.deb')]
                  assert len(names)==1
                  pathlib.Path(deb).write_bytes(z.read(names[0]))
          pathlib.Path('incoming').unlink()
          download("https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-978c-8210-90a7-0e780a5725ff/raw?se=2026-11-17T23%3A46%3A52Z&sp=r&sv=2026-06-06&sr=b&scid=28f2684d-3a80-4988-a243-f85dbcfb0db0&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-17T06%3A26%3A25Z&ske=2026-11-18T06%3A26%3A25Z&sks=b&skv=2026-06-06&sig=XJvoMcFQXVvMirAWDPMgiSas18HU7YPyX%2BTwFhCTs/o%3D",'icons/FloatSnap.png')
          download("https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1180-8210-98aa-13cb1b39080f/raw?se=2026-11-17T23%3A46%3A52Z&sp=r&sv=2026-06-06&sr=b&scid=28f2684d-3a80-4988-a243-f85dbcfb0db0&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-17T03%3A47%3A30Z&ske=2026-11-18T03%3A47%3A30Z&sks=b&skv=2026-06-06&sig=TJhpd/RoeJVvb58bB5U09DrbGz2wUicegYcxD36rs0M%3D",'screenshots/FloatSnap-gallery.png')
          im=Image.open('icons/FloatSnap.png');im.thumbnail((256,256));im.save('icons/FloatSnap.png')
          base='https://filpmax7-creator.github.io/repo/'
          description='FloatSnap lets you crop a screen region, resize and move it, annotate with pen, arrows, lines and rectangles, hide details with mosaic, lock or pin crops, copy images, extract Arabic and English text, read QR codes, translate online, save to Photos, share and rearrange toolbar controls. OCR accuracy varies by image. Tested on iPhone X, iOS 16.7.x, Dopamine Rootless. iOS 17, 18 and 26 compatibility is experimental. Gallery shows conceptual device frames with AI-rendered screenshot artwork.'
          views=[{'class':'DepictionSubheaderView','title':'FloatSnap'},{'class':'DepictionMarkdownView','markdown':description},{'class':'DepictionScreenshotsView','itemSize':'{370, 185}','itemCornerRadius':12,'screenshots':[{'url':base+'screenshots/FloatSnap-gallery.png','accessibilityText':'FloatSnap editing controls'}]},{'class':'DepictionTableTextView','title':'Tested','text':'iOS 16.7.x - Dopamine Rootless'},{'class':'DepictionTableTextView','title':'Developer','text':'Filp Max'}]
          pathlib.Path('floatsnap.json').write_text(json.dumps({'class':'DepictionTabView','minVersion':'0.4','tintColor':'#168bff','tabs':[{'class':'DepictionStackView','tabname':'Details','views':views}]}))
          pathlib.Path('floatsnap.html').write_text('<!doctype html><meta name="viewport" content="width=device-width"><title>FloatSnap</title><h1>FloatSnap</h1><p>'+description+'</p><img style="max-width:100%" src="screenshots/FloatSnap-gallery.png">')
          fields={}
          for line in subprocess.check_output(['dpkg-deb','-f',deb],text=True).splitlines():
              if ': ' in line:
                  k,v=line.split(': ',1);fields[k]=v
          assert fields['Package']=='local.floatsnap.tweak'
          fields.update({'Filename':'./'+deb,'Size':str(len(pathlib.Path(deb).read_bytes())),'Icon':base+'icons/FloatSnap.png','Depiction':base+'floatsnap.html','SileoDepiction':base+'floatsnap.json'})
          for key,alg in [('MD5sum','md5'),('SHA1','sha1'),('SHA256','sha256')]:fields[key]=hashlib.new(alg,pathlib.Path(deb).read_bytes()).hexdigest()
          old=pathlib.Path('Packages').read_text().strip().split('\n\n')
          old=[x for x in old if not x.startswith('Package: local.floatsnap.tweak\n')]
          old.append('\n'.join(k+': '+v for k,v in fields.items()))
          data=('\n\n'.join(old)+'\n').encode()
          pathlib.Path('Packages').write_bytes(data)
          pathlib.Path('Packages.gz').write_bytes(gzip.compress(data,mtime=0))
          pathlib.Path('Packages.bz2').write_bytes(bz2.compress(data))
          release=pathlib.Path('Release').read_text().split('MD5Sum:')[0].split('SHA256:')[0]
          release='\n'.join(x for x in release.splitlines() if not x.startswith('Date:'))+'\nDate: '+email.utils.formatdate(usegmt=True)+'\n'
          for title,alg in [('MD5Sum','md5'),('SHA256','sha256')]:
              release+=title+':\n'
              for name in ['Packages','Packages.gz','Packages.bz2']:
                  data=pathlib.Path(name).read_bytes()
                  release+=' '+hashlib.new(alg,data).hexdigest()+' '+str(len(data))+' '+name+'\n'
          pathlib.Path('Release').write_text(release)
          
      - name: Publish package and indexes
        run: |
          git config user.name "Filp Max"
          git config user.email "filpmax7@gmail.com"
          git add debs/FloatSnap-0.9.9.12.deb icons/FloatSnap.png screenshots/FloatSnap-gallery.png floatsnap.json floatsnap.html Packages Packages.gz Packages.bz2 Release
          git commit -m "Publish FloatSnap 0.9.9.12 with Sileo page"
          git push
