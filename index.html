<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filp max</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { 
            --bg: #121212; --card: #1e1e1e; --text: #f5f5f5; --sub: #aaa; 
            --accent: #0a84ff; --border: #333; --shadow: rgba(0,0,0,0.4);
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); margin: 0; padding: 20px; color: var(--text); direction: ltr; text-align: left; 
        }
        .container { max-width: 500px; margin: auto; }

        .header { 
            background: var(--card); padding: 25px; border-radius: 24px; 
            box-shadow: 0 8px 25px var(--shadow); border: 1px solid var(--border); text-align: center; margin-bottom: 20px; 
        }
        .header img { width: 85px; height: 85px; border-radius: 22%; margin-bottom: 12px; }
        .header h1 { margin: 5px 0; font-size: 24px; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn { 
            flex: 1; color: white; text-decoration: none; padding: 10px 5px; border-radius: 12px; 
            font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; 
        }

        .package-card { 
            background: var(--card); padding: 18px; border-radius: 22px; 
            border: 1px solid var(--border); box-shadow: 0 4px 15px var(--shadow); 
        }
        .pkg-top { display: flex; align-items: center; margin-bottom: 15px; }
        .pkg-top img { width: 55px; height: 55px; border-radius: 14px; margin-right: 12px; }

        .screenshot-section { margin-top: 15px; }
        .screenshot-title { font-size: 13px; font-weight: bold; color: var(--sub); margin-bottom: 10px; display: block; }
        .screenshot-scroll { 
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; 
            scrollbar-width: none; -ms-overflow-style: none; 
        }
        .screenshot-scroll::-webkit-scrollbar { display: none; }
        .screenshot-scroll img { 
            width: 150px; height: auto; border-radius: 16px; border: 1px solid var(--border); 
            box-shadow: 0 4px 12px var(--shadow); flex-shrink: 0; object-fit: cover; 
        }

        .changelog { 
            background: rgba(255,255,255,0.03); border-radius: 14px; padding: 12px 15px; 
            margin-top: 18px; font-size: 13px; border-left: 3px solid var(--accent); 
        }
        .social-links { display: flex; justify-content: center; gap: 25px; margin-top: 30px; }
        .social-links a { color: var(--text); font-size: 22px; transition: 0.2s; }
        .social-links a:hover { color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="icon.png" alt="Icon" onerror="this.src='https://filpmax7-creator.github.io/repo/icon.png'">
        <h1>filp max</h1>
        <p style="color:var(--sub); margin:3px 0 0; font-size:14px;">Tools Developer</p>
        <div class="btn-group">
            <a href="sileo://source/https://filpmax7-creator.github.io/repo/" class="btn" style="background:#2fbdff;"><i class="fas fa-plus"></i> Sileo</a>
            <a href="zbra://sources/add/https://filpmax7-creator.github.io/repo/" class="btn" style="background:#f99157;"><i class="fas fa-leaf"></i> Zebra</a>
            <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://filpmax7-creator.github.io/repo/" class="btn" style="background:#5e48e8;"><i class="fas fa-box"></i> Cydia</a>
        </div>
    </div>

    <div class="package-card">
        <div class="pkg-top">
            <img src="icon.png" alt="FloatSnap" onerror="this.src='https://filpmax7-creator.github.io/repo/icon.png'">
            <div style="flex-grow:1">
                <h3 style="margin:0;">FloatSnap <span style="font-size:10px; background:var(--accent); color:white; padding:2px 7px; border-radius:12px; vertical-align: middle;">0.9.9.6</span></h3>
                <p style="color:var(--sub); font-size:12px; margin: 4px 0 0;">Floating window control tweak for iOS.</p>
            </div>
        </div>

        <div class="screenshot-section">
            <span class="screenshot-title">Screenshots:</span>
            <div class="screenshot-scroll">
                <img src="screenshots/screen1.png" alt="Screen 1" onerror="this.style.display='none'">
                <img src="screenshots/screen2.png" alt="Screen 2" onerror="this.style.display='none'">
                <img src="screenshots/screen3.png" alt="Screen 3" onerror="this.style.display='none'">
                <img src="screenshots/screen4.png" alt="Screen 4" onerror="this.style.display='none'">
            </div>
        </div>

        <div class="changelog">
            <strong style="color:var(--text);">Changelog:</strong>
            <ul style="margin:8px 0 0; padding-left:16px; color:var(--sub); line-height: 1.5; font-size: 12px;">
                <li>Updated package depictions and description.</li>
                <li>Added native screenshots viewer.</li>
            </ul>
        </div>
    </div>

    <div class="social-links">
        <a href="https://x.com/filpmax7?s=11" target="_blank"><i class="fab fa-x-twitter"></i></a>
        <a href="mailto:filpmax7@gmail.com"><i class="fas fa-envelope"></i></a>
        <a href="https://github.com/filpmax7-creator" target="_blank"><i class="fab fa-github"></i></a>
    </div>
</div>

</body>
</html>
